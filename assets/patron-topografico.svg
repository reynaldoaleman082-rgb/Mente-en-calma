<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <pattern id="topografia" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Curvas topográficas inspiradas en el isotipo -->
      <path d="M 50 0 C 70 25, 80 10, 50 10 C 20 10, 30 25, 50 50" 
            fill="none" stroke="#3D1E3A" stroke-width="0.5" opacity="0.08"/>
      <path d="M 50 50 C 25 70, 10 80, 10 50 C 10 20, 25 30, 50 50" 
            fill="none" stroke="#F2B38B" stroke-width="0.5" opacity="0.06"/>
      <path d="M 50 50 C 75 70, 90 80, 90 50 C 90 20, 75 30, 50 50" 
            fill="none" stroke="#3D1E3A" stroke-width="0.5" opacity="0.05"/>
      <!-- Líneas adicionales para más textura -->
      <path d="M 0 50 Q 50 25 100 50" fill="none" stroke="#3D1E3A" stroke-width="0.3" opacity="0.04"/>
      <path d="M 50 0 Q 25 50 50 100" fill="none" stroke="#F2B38B" stroke-width="0.3" opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#topografia)"/>
</svg>