<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <pattern id="burbujas" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Burbujas orgánicas dispersas -->
      <g fill="#3D1E3A" opacity="0.025">
        <circle cx="20" cy="30" r="8"/>
        <circle cx="80" cy="15" r="5"/>
        <circle cx="140" cy="40" r="12"/>
        <circle cx="170" cy="80" r="6"/>
        <circle cx="100" cy="100" r="20"/>
        <circle cx="30" cy="120" r="9"/>
        <circle cx="90" cy="160" r="7"/>
        <circle cx="160" cy="130" r="11"/>
        <circle cx="10" cy="180" r="4"/>
        <circle cx="120" cy="180" r="15"/>
      </g>
      <!-- Burbujas en arena -->
      <g fill="#F2B38B" opacity="0.018">
        <circle cx="50" cy="60" r="6"/>
        <circle cx="110" cy="20" r="10"/>
        <circle cx="170" cy="50" r="4"/>
        <circle cx="40" cy="140" r="13"/>
        <circle cx="130" cy="170" r="8"/>
        <circle cx="180" cy="110" r="5"/>
        <circle cx="70" cy="190" r="9"/>
      </g>
      <!-- Anillos (solo contorno) -->
      <g stroke="#3D1E3A" stroke-width="0.5" fill="none" opacity="0.02">
        <circle cx="100" cy="100" r="25"/>
        <circle cx="100" cy="100" r="35"/>
        <circle cx="100" cy="100" r="45"/>
        <circle cx="50" cy="50" r="18"/>
        <circle cx="150" cy="150" r="22"/>
      </g>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#burbujas)"/>
</svg>