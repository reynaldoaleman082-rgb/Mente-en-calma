<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <pattern id="ondas-organicas" x="0" y="0" width="400" height="400" patternUnits="userSpaceOnUse">
      <!-- Ondas orgánicas fluidas en ciruela -->
      <g fill="none" stroke="#3D1E3A" stroke-width="0.6" opacity="0.025">
        <path d="M -50 50 
                 Q 100 0 200 50 
                 T 400 50 
                 T 600 50"/>
        <path d="M -50 150 
                 Q 100 100 200 150 
                 T 400 150 
                 T 600 150"/>
        <path d="M -50 250 
                 Q 100 200 200 250 
                 T 400 250 
                 T 600 250"/>
        <path d="M -50 350 
                 Q 100 300 200 350 
                 T 400 350 
                 T 600 350"/>
        <!-- Ondas inversas -->
        <path d="M -50 100 
                 Q 100 150 200 100 
                 T 400 100 
                 T 600 100"/>
        <path d="M -50 200 
                 Q 100 250 200 200 
                 T 400 200 
                 T 600 200"/>
        <path d="M -50 300 
                 Q 100 350 200 300 
                 T 400 300 
                 T 600 300"/>
      </g>
      <!-- Ondas en arena -->
      <g fill="none" stroke="#F2B38B" stroke-width="0.4" opacity="0.018">
        <path d="M -50 0 
                 Q 100 -50 200 0 
                 T 400 0 
                 T 600 0"/>
        <path d="M -50 200 
                 Q 100 150 200 200 
                 T 400 200 
                 T 600 200"/>
        <path d="M -50 400 
                 Q 100 350 200 400 
                 T 400 400 
                 T 600 400"/>
      </g>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#ondas-organicas)"/>
</svg>