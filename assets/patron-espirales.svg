<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <pattern id="espirales" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Espirales suaves en ciruela muy sutil -->
      <g stroke="#3D1E3A" stroke-width="0.4" fill="none" opacity="0.03">
        <path d="M 100 100 
                 a 1 1 0 1 1 2 0 
                 a 2 2 0 1 1 4 0 
                 a 3 3 0 1 1 6 0 
                 a 5 5 0 1 1 10 0 
                 a 8 8 0 1 1 16 0 
                 a 13 13 0 1 1 26 0 
                 a 21 21 0 1 1 42 0"/>
        <path d="M 300 300 
                 a 1 1 0 1 1 -2 0 
                 a 2 2 0 1 1 -4 0 
                 a 3 3 0 1 1 -6 0 
                 a 5 5 0 1 1 -10 0 
                 a 8 8 0 1 1 -16 0 
                 a 13 13 0 1 1 -26 0 
                 a 21 21 0 1 1 -42 0"/>
        <path d="M 100 300 
                 a 1 1 0 1 1 2 0 
                 a 2 2 0 1 1 4 0 
                 a 3 3 0 1 1 6 0 
                 a 5 5 0 1 1 10 0 
                 a 8 8 0 1 1 16 0"/>
        <path d="M 300 100 
                 a 1 1 0 1 1 -2 0 
                 a 2 2 0 1 1 -4 0 
                 a 3 3 0 1 1 -6 0 
                 a 5 5 0 1 1 -10 0 
                 a 8 8 0 1 1 -16 0"/>
      </g>
      <!-- Círculos concéntricos en arena muy sutil -->
      <g stroke="#F2B38B" stroke-width="0.3" fill="none" opacity="0.02">
        <circle cx="50" cy="50" r="15"/>
        <circle cx="50" cy="50" r="30"/>
        <circle cx="50" cy="50" r="45"/>
        <circle cx="150" cy="150" r="15"/>
        <circle cx="150" cy="150" r="30"/>
        <circle cx="150" cy="150" r="45"/>
        <circle cx="50" cy="150" r="15"/>
        <circle cx="50" cy="150" r="30"/>
        <circle cx="150" cy="50" r="15"/>
        <circle cx="150" cy="50" r="30"/>
      </g>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#espirales)"/>
</svg>