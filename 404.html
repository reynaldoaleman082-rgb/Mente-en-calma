<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="robots" content="noindex">

  <!-- Favicon: isotipo (símbolo de la marca) -->

  <link rel="alternate icon" href="assets/favicon.svg">

  <!-- Mismo CSS único: hereda mapa topográfico, cristal líquido y
       el resaltado de calma -->
  <link rel="stylesheet" href="css/estilos.css">

  <!-- Etiquetas Open Graph (coherentes con las del sitio) -->
  <meta property="og:title" content="Mente en Calma">
  <meta property="og:description" content="Esta página no existe. Respira, cuenta hasta cuatro y vuelve al inicio.">
  <meta property="og:type" content="website">

</head>
<body>

  <!-- ==================== ENCABEZADO ==================== -->
  <!-- Mismo cristal líquido sticky del sitio; aquí solo con la marca -->
  <header class="cabecera">
    <div class="cabecera__contenedor">
      <a href="index.html" class="marca">
        <img src="assets/marca/imagotipo.svg" alt="Mente en Calma" class="logo-imagen">
      </a>
    </div>
  </header>

  <main>

    <!-- ==================== MENSAJE 404 ==================== -->
    <section class="hero">
      <div class="hero__contenedor">
        <h1 class="hero__titulo">Ups, esta página se perdió</h1>

        <!-- La tarjeta de cristal líquido (mismo material que el Bento)
             contiene el mensaje y el botón de vuelta -->

          <p class="hero__subtitulo">
            A veces la mente se distrae y termina en lugares que no
            existen. Pero está bien,
            <span class="resaltado">respira</span>. Toma aire, cuenta
            hasta cuatro, y vuelve al inicio.
          </p>
          <div class="hero__botones">
            <a href="index.html" class="boton boton--primario">Volver al inicio</a>
          </div>
        </article>
      </div>
      <!-- Ondas decorativas originales del hero -->
      <div class="hero__ondas" aria-hidden="true"></div>
    </section>

  </main>

  <!-- Sin scripts: una 404 no necesita lógica, solo calma -->
